[project]
name = "marine-radar-detection"
version = "0.1.0"
description = "Classical vs. Deep Learning Object Detection in X-Band Marine Radar Imagery"
authors = [
    {name = "J.C. Vaught", email = "jvaught@sc.edu"},
    {name = "Ty Dangerfield"},
]
requires-python = ">=3.11,<3.12"

dependencies = [
    # Core
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "tqdm",
    "pyyaml",

    # Image processing (classical)
    "opencv-python>=4.8",
    "scikit-image>=0.21",
    "PyWavelets>=1.4",

    # Deep learning
    "torch==2.5.1",
    "torchvision==0.20.1",
    "ultralytics==8.4.14",
    "sahi>=0.11",
    "transformers>=4.36",

    # Evaluation
    "pycocotools==2.0.11",
    "tidecv>=1.0",

    # Visualization
    "matplotlib>=3.7",
    "seaborn>=0.13",

    # Benchmarking
    "fvcore",
    "thop",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "ty==0.0.104",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
