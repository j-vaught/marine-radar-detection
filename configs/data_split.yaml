# Data splitting configuration
# Temporal splitting by recording session prevents data leakage

# Strategy: split by sub-dataset (each is a separate recording session)
strategy: "by_dataset"

splits:
  train:
    - "MANV"       # 976 frames (largest sub-dataset)
  val:
    - "DARC"       # 527 frames
  test:
    - "DAAN"       # 760 frames (primary evaluation set from the paper)

# HAXR stations can be split across train/val/test
haxr_splits:
  train:
    - "altona"
    - "amerikahoeft"
    - "ellerholzhoeft"
    - "kattwyk"
    - "krusenbusch"
    - "koehlbrandhoeft"
    - "landungsbruecken"
    - "hohe_schaar"
    - "nesssand"
  val:
    - "parkhafen"
    - "seemannshoeft"
  test:
    - "reiherstieg"
    - "sandauhafen"

# HAXR rendering parameters
haxr:
  sample_rate: 10          # render every Nth cycle
  img_size: 1024           # output PPI image size
  box_size: 20             # AIS ground truth bbox size (pixels)
  time_window: 1.0         # AIS matching window (seconds)

# DLR annotation parameters — hybrid AIS-anchored / image-grounded GT
# (see src/data/ais_anchored_gt.py).
dlr:
  max_range: 6000           # meters (display range, reference only now)

  # Polar-point DBSCAN: splits each AIS record into per-target seeds.
  dbscan_eps: 200           # metres
  dbscan_min_samples: 5

  # Image-grounded blob extraction.
  blob_threshold: 25        # red-channel intensity threshold
  blob_min_area: 10         # reject speckle (pixels^2)
  blob_max_area: 8000       # reject outer-ring / land responses (pixels^2)

  # Greedy AIS seed → blob matching radius (pixels).
  # 60 chosen empirically: DAAN/DARC match almost everything at 30, but MANV
  # (harbour scene) shows a systematic 44–66 px AIS→radar offset. 60 recovers
  # most of MANV without starting to fuse neighbouring harbour vessels.
  match_radius_px: 60

  # Include bright blobs with no AIS match as category 2 "unlabelled"?
  include_unclaimed: false

# Tiling parameters
tiling:
  tile_size: 640
  overlap: 0.2
  min_visibility: 0.3     # minimum fraction of box visible in tile
