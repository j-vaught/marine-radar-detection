# YOLO26 Detection with optional SAHI tiled inference

model:
  name: "YOLO26"
  variant: "yolo26m"
  pretrained: true
  task: "detect"

training:
  epochs: 30
  batch_size: 4
  min_batch_size: 2
  imgsz: 1024
  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.01
  warmup_epochs: 3
  patience: 8
  device: "0"
  workers: 8
  seeds: [42]
  amp: true
  cache: false

sahi:
  enabled: false
  slice_height: 640
  slice_width: 640
  overlap_height_ratio: 0.2
  overlap_width_ratio: 0.2
  postprocess_type: "NMS"
  postprocess_match_threshold: 0.5
  confidence_threshold: 0.05

augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  flipud: 0.5
  fliplr: 0.5
  mosaic: 0.0
  mixup: 0.0

postprocessing:
  score_floor: 0.001
  score_threshold: 0.05
  score_threshold_grid: [0.01, 0.05, 0.10, 0.20, 0.30, 0.50]
