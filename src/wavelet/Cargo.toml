[package]
name = "wavelet"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = []
cuda = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cc = "1.1"
